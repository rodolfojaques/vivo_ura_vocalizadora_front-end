server {
    listen 80;
    server_name app.ura.noc.redestlf.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.ura.noc.redestlf.br;

    ssl_certificate /opt/ura-cert/app.ura.noc.redestlf.br.cer;
    ssl_certificate_key /opt/ura-cert/app.ura.noc.redestlf.br.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}